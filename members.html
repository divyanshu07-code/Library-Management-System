{% extends "base.html" %}
{% block title %}Members - Library MS{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Members</h1>
    <a class="btn" href="{{ url_for('add_member') }}">+ Add Member</a>
</div>

<table class="table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for member in members %}
        <tr>
            <td>{{ member.name }}</td>
            <td>{{ member.email }}</td>
            <td>{{ member.phone or "-" }}</td>
            <td class="actions">
                <form method="post" action="{{ url_for('delete_member', member_id=member.id) }}"
                      onsubmit="return confirm('Delete this member?');">
                    <button type="submit" class="link-btn">Delete</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4">No members found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
