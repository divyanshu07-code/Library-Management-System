{% extends "base.html" %}
{% block title %}Issue Book - Library MS{% endblock %}
{% block content %}
<h1>Issue a Book</h1>
<form class="form" method="post">
    <label>Book
        <select name="book_id" required>
            <option value="" disabled selected>Select a book</option>
            {% for book in books %}
            <option value="{{ book.id }}">{{ book.title }} ({{ book.available }} available)</option>
            {% endfor %}
        </select>
    </label>
    <label>Member
        <select name="member_id" required>
            <option value="" disabled selected>Select a member</option>
            {% for member in members %}
            <option value="{{ member.id }}">{{ member.name }} ({{ member.email }})</option>
            {% endfor %}
        </select>
    </label>
    <label>Loan period (days)
        <input type="number" name="days" min="1" value="14" required>
    </label>
    <button class="btn" type="submit">Issue Book</button>
    <a class="btn btn-secondary" href="{{ url_for('issues') }}">Cancel</a>
</form>
{% endblock %}
